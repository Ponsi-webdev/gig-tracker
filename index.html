<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gig Tracker</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a6aa1"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gig Tracker">
<style>
:root{--bg:#eef3f7;--card:#fff;--tx:#0e2233;--mu:#5b6d7c;--ac:#0a6aa1;--bd:#d5dfe7;--wa:#17a34a;--bad:#b3402f;--sf:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0c151d;--card:#15212c;--tx:#e6eef4;--mu:#8da1b1;--ac:#4cb3ea;--bd:#263846;--wa:#35c46a;--bad:#e5806f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(84px + var(--sf))}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:15px;margin:16px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px rgba(10,50,80,.06)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:6px}.r:first-child{margin-top:0}
.m{color:var(--mu);font-size:13px;word-break:break-word}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:1px 9px;color:var(--mu);white-space:nowrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;width:100%}
textarea{min-height:84px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;min-height:44px}
button.a{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:10px}
button.p{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
button.d{color:var(--bad)}
.q{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q button{font-weight:600}
.big{font-size:20px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap;min-height:38px;padding:6px 12px}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pl{display:flex;gap:8px;overflow-x:auto}.pl .c{min-width:118px;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sf);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:13px;color:var(--mu);min-height:56px}nav .on{color:var(--ac);font-weight:700}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9;align-items:flex-end;justify-content:center}
#sh>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + var(--sf))}
#t{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--sf));background:var(--tx);color:var(--bg);padding:11px;border-radius:10px;display:none;z-index:20;text-align:center}
.tl{border-left:2px solid var(--bd);margin:8px 0 0 6px;padding-left:12px}.tl div{margin:0 0 9px}.e{color:var(--mu);padding:12px 2px}
.logo{width:72px;height:72px;border-radius:16px;display:block;margin:30px auto 8px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<div id="app"></div><div id="sh"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://jgfiukzwnvjrmimhuddd.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpnZml1a3p3bnZqcm1pbWh1ZGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODYxNTAsImV4cCI6MjEwNjQ2MjE1MH0.SwvngFL0AzNuPzrNG_JAWpzvxqyDXb239ZZ4CMFXgUU');
const STG=[['new_lead','New Lead'],['contacted','Contacted'],['interested','Interested'],['quote_sent','Quote Sent'],['negotiating','Negotiating'],['won','Won'],['lost','Lost']];
const SN=Object.fromEntries(STG),ACT=['new_lead','contacted','interested','quote_sent','negotiating'];
const SRC=['WhatsApp','Instagram','Facebook','TikTok','Referral','Website','Walk-in','Phone','Other'];
const LOST=['Price','Competitor','No response','Client cancelled','Delayed decision','Not qualified','Other'];
let U=null,B=null,CL=[],GG=[],AC=[],tab='home',gf='active',uid=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=(n=0)=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=n=>(B&&B.currency||'UGX')+' '+Math.round(+n||0).toLocaleString('en-US');
const norm=p=>{p=(p||'').replace(/\D/g,'');if(p[0]=='0')p='256'+p.slice(1);else if(p.length==9)p='256'+p;return p};
const cl=id=>CL.find(c=>c.id==id),gg=id=>GG.find(g=>g.id==id);
const cn=g=>{const c=cl(g.client_id);return c?c.name:'No client'};
const v=id=>($('#'+id)||{}).value||'';
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function sheet(h){const s=$('#sh');s.innerHTML='<div>'+h+'</div>';s.style.display='flex';s.onclick=e=>{if(e.target===s)closeS()}}
function closeS(){$('#sh').style.display='none';$('#sh').innerHTML=''}
async function ok(p){const r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data}
async function log(gid,cid,kind,note){try{await ok(sb.from('activities').insert({gig_id:gid,client_id:cid,kind,note}))}catch(e){}}

/* ---------- auth + boot ---------- */
function authView(mode){
 $('#app').innerHTML=`<img class="logo" src="icon-192.png" alt=""><h1 style="text-align:center">Gig Tracker</h1><p class="m" style="text-align:center">Turn conversations into customers, and customers into money.</p>
 <label>Email</label><input id="em" type="email" autocomplete="email"><label>Password (6+ characters)</label><input id="pw" type="password" autocomplete="${mode=='up'?'new-password':'current-password'}">
 <button class="a" onclick="doAuth('${mode}')">${mode=='up'?'Create account':'Sign in'}</button>
 <p class="m" style="text-align:center">${mode=='up'?'Have an account?':'New here?'} <a href="#" onclick="authView('${mode=='up'?'in':'up'}');return false">${mode=='up'?'Sign in':'Create account'}</a></p>`}
async function doAuth(mode){const e=v('em').trim(),p=v('pw');if(!e||p.length<6)return toast('Enter your email and a password of 6+ characters.');
 const r=mode=='up'?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error)return toast(r.error.message);if(mode=='up'&&!r.data.session)toast('Check your email to confirm, then sign in.')}
sb.auth.onAuthStateChange((ev,s)=>{if(ev=='TOKEN_REFRESHED')return;const id=s&&s.user?s.user.id:null;if(id===uid&&ev!='SIGNED_IN')return;uid=id;U=s?s.user:null;setTimeout(boot,0)});
async function boot(){if(!U){B=null;CL=[];GG=[];AC=[];return authView('in')}
 $('#app').innerHTML='<p class="e">Loading…</p>';
 try{const[b,c,g,a]=await Promise.all([ok(sb.from('businesses').select('*').maybeSingle()),ok(sb.from('clients').select('*').order('name')),ok(sb.from('gigs').select('*').order('created_at',{ascending:false})),ok(sb.from('activities').select('*').order('created_at',{ascending:false}).limit(600))]);
  B=b;CL=c;GG=g;AC=a}catch(e){return $('#app').innerHTML='<p class="e">Could not load your data. Check your connection.</p><button class="a" onclick="boot()">Try again</button>'}
 B?render():onboard()}
function onboard(){$('#app').innerHTML=`<h1>Welcome to Gig Tracker</h1><p class="m">Four quick questions, then add your first gig.</p>
 <label>What's your business?</label><input id="ob1" placeholder="Web design, photography, shop…"><label>What do you sell?</label><input id="ob2" placeholder="Websites, photo shoots, clothes…">
 <label>Your name or business name</label><input id="ob3"><label>WhatsApp number</label><input id="ob4" inputmode="tel" placeholder="07…"><label>Currency</label><select id="ob5"><option>UGX</option><option>KES</option><option>TZS</option><option>RWF</option><option>USD</option></select>
 <button class="a" onclick="saveOb()">Continue</button>`}
async function saveOb(){if(!v('ob3').trim())return toast('Enter your name or business name.');
 try{B=await ok(sb.from('businesses').insert({name:v('ob3').trim(),business_type:v('ob1').trim(),offering:v('ob2').trim(),whatsapp:v('ob4').trim(),phone:v('ob4').trim(),currency:v('ob5')}).select().single())}catch(e){return}
 render();newGig(true)}

/* ---------- shell ---------- */
function render(){const T=[['home','Home'],['gigs','Gigs'],['clients','Clients'],['more','More']];
 const body={home:homeV,gigs:gigsV,clients:clientsV,more:moreV}[tab]();
 $('#app').innerHTML=body+`<nav>${T.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${n}</button>`).join('')}</nav>`}
function card(g){const due=g.next_follow_up&&g.next_follow_up<=day()&&ACT.includes(g.stage);
 return `<div class="c" onclick="openGig('${g.id}')"><div class="r"><b>${esc(g.title)}</b><span class="tag">${SN[g.stage]}</span></div>
 <div class="m">${esc(cn(g))} · ${fmt(g.value)}</div>${g.next_follow_up?`<div class="m" style="${due?'color:var(--bad);font-weight:600':''}">${due?'Follow up due: ':'Follow up: '}${g.next_follow_up}${g.next_action?' · '+esc(g.next_action):''}</div>`:''}</div>`}

/* ---------- home ---------- */
function best(){const t=day(),L=[];
 GG.forEach(g=>{if(ACT.includes(g.stage)){
  if(g.next_follow_up&&g.next_follow_up<=t)L.push({g,s:2e9+ +g.value,x:`Follow up with ${cn(g)}`});
  else if(g.stage=='quote_sent'&&(Date.now()-new Date(g.updated_at))/864e5>=3)L.push({g,s:1e9+ +g.value,x:`Chase the quote for ${cn(g)}`});
  else if(g.stage=='new_lead'&&!g.next_follow_up)L.push({g,s:+g.value,x:`Contact ${cn(g)}`})}
  if(g.stage=='won'&&g.deadline&&g.deadline<=t)L.push({g,s:3e9,x:`Deliver ${g.title}, deadline ${g.deadline==t?'today':g.deadline}`})});
 return L.sort((a,b)=>b.s-a.s).slice(0,6)}
function homeV(){const act=GG.filter(g=>ACT.includes(g.stage)),pv=act.reduce((a,g)=>a+ +g.value,0),won=GG.filter(g=>g.stage=='won'),bs=best();
 return `<h1>Hi ${esc(B.name)}</h1>
 <div class="q"><button class="a" style="margin:0" onclick="newGig()">+ New Gig</button><button class="a" style="margin:0" onclick="newClient()">+ New Client</button></div>
 <h2>Today's best actions</h2>${bs.map(o=>`<div class="c" onclick="openGig('${o.g.id}')"><b>${esc(o.x)}</b><div class="m">${esc(o.g.title)} · ${fmt(o.g.value)}</div></div>`).join('')||'<div class="c e">Nothing urgent. Add a gig or set follow-up dates to see your best actions here.</div>'}
 <h2>Pipeline</h2><div class="m">${act.length} open gigs worth ${fmt(pv)} · ${won.length} won worth ${fmt(won.reduce((a,g)=>a+ +g.value,0))}</div>
 <div class="pl" style="margin-top:8px">${STG.slice(0,6).map(([k,n])=>{const x=GG.filter(g=>g.stage==k);return `<div class="c" onclick="gf='${k}';tab='gigs';render()"><div class="m">${n}</div><div class="big">${x.length}</div><div class="m">${fmt(x.reduce((a,g)=>a+ +g.value,0))}</div></div>`}).join('')}</div>`}

/* ---------- gigs ---------- */
function gigsV(){const f=GG.filter(g=>gf=='all'||(gf=='active'?ACT.includes(g.stage):g.stage==gf));
 return `<h1>Gigs</h1><div class="chips">${[['active','Open'],...STG,['all','All']].map(([k,n])=>`<button class="${gf==k?'on':''}" onclick="gf='${k}';render()">${n}</button>`).join('')}</div>
 ${f.map(card).join('')||'<div class="c e"><b>Your first gig is waiting.</b><br>Track your first customer opportunity and start building your pipeline.</div>'}<button class="a" onclick="newGig()">+ New Gig</button>`}
function opts(a,sel){return a.map(x=>`<option ${x==sel?'selected':''}>${esc(x)}</option>`).join('')}
function newGig(first){sheet(`<h1>${first?"Let's track your first gig":'New gig'}</h1>
 <label>Gig title</label><input id="g1" placeholder="Business website"><label>Client</label><select id="g2"><option value="">New client…</option>${CL.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
 <input id="g3" placeholder="New client name" style="margin-top:6px"><label>Client WhatsApp (07…)</label><input id="g4" inputmode="tel">
 <label>Value (${esc(B.currency)})</label><input id="g5" inputmode="numeric"><label>Lead source</label><select id="g6">${opts(SRC)}</select>
 <label>Follow up on</label><input id="g7" type="date" value="${day(2)}"><button class="a" onclick="saveNewGig()">Save gig</button><button class="a" style="background:none;color:var(--mu);border-color:var(--bd)" onclick="closeS()">Cancel</button>`)}
async function saveNewGig(){const t=v('g1').trim();if(!t)return toast('Enter a gig title.');let cid=v('g2')||null;
 try{if(!cid){const n=v('g3').trim();if(n){const c=await ok(sb.from('clients').insert({name:n,whatsapp:v('g4').trim(),phone:v('g4').trim()}).select().single());CL.push(c);cid=c.id}}
 const g=await ok(sb.from('gigs').insert({title:t,client_id:cid,value:parseFloat(v('g5').replace(/[^\d.]/g,''))||0,lead_source:v('g6'),next_follow_up:v('g7')||null,next_action:'Follow up'}).select().single());
 GG.unshift(g);await log(g.id,cid,'created','Lead created');await refreshAct();closeS();tab='gigs';gf='active';render();toast('Gig saved')}catch(e){}}
async function refreshAct(){try{AC=await ok(sb.from('activities').select('*').order('created_at',{ascending:false}).limit(600))}catch(e){}}
function msgFor(g){const c=cl(g.client_id),n=c?c.name.split(' ')[0]:'there',me=B.name;
 if(g.stage=='quote_sent')return `Hi ${n}, just checking in regarding the quote for ${g.title}. Please let me know if you'd like me to clarify anything. - ${me}`;
 if(g.stage=='won')return `Hi ${n}, thank you for choosing me for ${g.title}. I'll keep you updated on progress. - ${me}`;
 return `Hi ${n}, this is ${me}. I'm following up on ${g.title}. Would you like to go ahead or do you have any questions?`}
function openGig(id){const g=gg(id),c=cl(g.client_id),h=AC.filter(a=>a.gig_id==id);
 sheet(`<div class="r"><h1 style="margin:0">${esc(g.title)}</h1><button onclick="closeS()">Close</button></div><div class="m">${esc(cn(g))} · ${fmt(g.value)}</div>
 <label>Stage</label><select id="d0" onchange="moveStage('${id}',this.value)">${STG.map(([k,n])=>`<option value="${k}" ${k==g.stage?'selected':''}>${n}</option>`).join('')}</select>
 ${g.lost_reason?`<div class="m">Lost because: ${esc(g.lost_reason)}</div>`:''}
 <label>Title</label><input id="d1" value="${esc(g.title)}"><label>Value</label><input id="d2" inputmode="numeric" value="${g.value}">
 <label>Next action</label><input id="d3" value="${esc(g.next_action||'')}"><label>Follow up on</label><input id="d4" type="date" value="${g.next_follow_up||''}">
 <label>Deadline</label><input id="d5" type="date" value="${g.deadline||''}"><label>Lead source</label><select id="d6">${opts(SRC,g.lead_source)}</select>
 <label>Notes</label><textarea id="d7">${esc(g.notes||'')}</textarea><button class="a" onclick="saveGig('${id}')">Save changes</button>
 <h2>Message ${esc(c?c.name:'client')}</h2><textarea id="d8">${esc(msgFor(g))}</textarea><button class="a" style="background:var(--wa);border-color:var(--wa)" onclick="waGig('${id}')">Open WhatsApp</button>
 <h2>Timeline</h2><div class="r" style="margin:0"><input id="d9" placeholder="Add a note" style="flex:1"><button onclick="addNote('${id}')">Add</button></div>
 <div class="tl" style="margin-top:12px">${h.map(a=>`<div><b>${esc(a.note||a.kind)}</b><div class="m">${new Date(a.created_at).toLocaleDateString()}</div></div>`).join('')||'<div class="m">No activity yet.</div>'}</div>
 <button class="a d" style="background:none" onclick="delGig('${id}')">Delete gig</button>`)}
async function upGig(id,p,kind,note){try{const g=await ok(sb.from('gigs').update(p).eq('id',id).select().single());GG=GG.map(x=>x.id==id?g:x);if(kind){await log(id,g.client_id,kind,note);await refreshAct()}return g}catch(e){}}
async function moveStage(id,s){if(s=='lost'){return sheet(`<h1>Why was it lost?</h1><select id="lr">${opts(LOST)}</select><button class="a" onclick="confirmLost('${id}')">Mark as lost</button><button class="a" style="background:none;color:var(--mu);border-color:var(--bd)" onclick="openGig('${id}')">Cancel</button>`)}
 const p={stage:s,lost_reason:null};if(s!='won')p.last_contact_date=day();const g=await upGig(id,p,'stage','Moved to '+SN[s]);if(g){render();openGig(id)}}
async function confirmLost(id){const g=await upGig(id,{stage:'lost',lost_reason:v('lr'),next_follow_up:null},'stage','Marked lost: '+v('lr'));if(g){closeS();render()}}
async function saveGig(id){const o=gg(id),np=v('d4')||null,p={title:v('d1').trim()||o.title,value:parseFloat(v('d2').replace(/[^\d.]/g,''))||0,next_action:v('d3'),next_follow_up:np,deadline:v('d5')||null,lead_source:v('d6'),notes:v('d7')};
 const g=await upGig(id,p,np!=o.next_follow_up&&np?'followup':null,'Follow-up set for '+np);if(g){closeS();render();toast('Saved')}}
async function addNote(id){const n=v('d9').trim();if(!n)return;await log(id,gg(id).client_id,'note',n);await refreshAct();openGig(id)}
async function waGig(id){const g=gg(id),c=cl(g.client_id),p=norm(c&&(c.whatsapp||c.phone));if(!p)return toast('Add a WhatsApp number to this client first.');
 window.open('https://wa.me/'+p+'?text='+encodeURIComponent(v('d8')),'_blank');
 await upGig(id,{last_contact_date:day(),next_follow_up:g.next_follow_up&&g.next_follow_up>day()?g.next_follow_up:day(3),stage:g.stage=='new_lead'?'contacted':g.stage},'message','Message sent on WhatsApp');render()}
async function delGig(id){if(!confirm('Delete this gig and its history?'))return;try{await ok(sb.from('gigs').delete().eq('id',id));GG=GG.filter(g=>g.id!=id);closeS();render()}catch(e){}}

/* ---------- clients ---------- */
function clientsV(){return `<h1>Clients</h1>${CL.map(c=>{const gs=GG.filter(g=>g.client_id==c.id),w=gs.filter(g=>g.stage=='won').reduce((a,g)=>a+ +g.value,0);
 return `<div class="c" onclick="openClient('${c.id}')"><div class="r"><b>${esc(c.name)}</b>${gs.filter(g=>g.stage=='won').length>1?'<span class="tag">Repeat</span>':''}</div><div class="m">${gs.length} gigs · ${fmt(w)} earned${c.whatsapp?' · '+esc(c.whatsapp):''}</div></div>`}).join('')||'<div class="c e"><b>No clients yet.</b><br>Add a client or create a gig and add the client there.</div>'}<button class="a" onclick="newClient()">+ New Client</button>`}
function clientForm(c){c=c||{};return `<label>Name</label><input id="k1" value="${esc(c.name||'')}"><label>WhatsApp (07…)</label><input id="k2" inputmode="tel" value="${esc(c.whatsapp||'')}">
 <label>Email</label><input id="k3" type="email" value="${esc(c.email||'')}"><label>Company</label><input id="k4" value="${esc(c.company||'')}"><label>Notes</label><textarea id="k5">${esc(c.notes||'')}</textarea>`}
function newClient(){sheet(`<h1>New client</h1>${clientForm()}<button class="a" onclick="saveClient()">Save client</button>`)}
async function saveClient(id){const n=v('k1').trim();if(!n)return toast('Enter a name.');const p={name:n,whatsapp:v('k2').trim(),phone:v('k2').trim(),email:v('k3').trim(),company:v('k4').trim(),notes:v('k5')};
 try{if(id){const c=await ok(sb.from('clients').update(p).eq('id',id).select().single());CL=CL.map(x=>x.id==id?c:x)}else CL.push(await ok(sb.from('clients').insert(p).select().single()));
 CL.sort((a,b)=>a.name.localeCompare(b.name));closeS();render()}catch(e){}}
function openClient(id){const c=cl(id),gs=GG.filter(g=>g.client_id==id),w=gs.filter(g=>g.stage=='won');
 sheet(`<div class="r"><h1 style="margin:0">${esc(c.name)}</h1><button onclick="closeS()">Close</button></div>
 <div class="c"><div class="m">Customer value</div><div class="big">${fmt(w.reduce((a,g)=>a+ +g.value,0))}</div><div class="m">${gs.length} gigs · ${w.length} won</div></div>
 ${gs.map(g=>`<div class="c" onclick="openGig('${g.id}')"><b>${esc(g.title)}</b> <span class="tag">${SN[g.stage]}</span><div class="m">${fmt(g.value)}</div></div>`).join('')}
 ${clientForm(c)}<button class="a" onclick="saveClient('${id}')">Save changes</button><button class="a d" style="background:none" onclick="delClient('${id}')">Delete client</button>`)}
async function delClient(id){if(!confirm('Delete this client? Their gigs stay but lose the client link.'))return;try{await ok(sb.from('clients').delete().eq('id',id));CL=CL.filter(c=>c.id!=id);GG=GG.map(g=>g.client_id==id?{...g,client_id:null}:g);closeS();render()}catch(e){}}
